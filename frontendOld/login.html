<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
</head>
<body>

  <h2>Crear cuenta</h2>

  <input type="text" id="name" placeholder="Nombre">

  <input type="text" id="lastname" placeholder="Apellidos">

  <input type="text" id="nif" placeholder="NIF / DNI">

  <input type="text" id="address" placeholder="Dirección">

  <input type="text" id="city" placeholder="Ciudad">

  <input type="text" id="postalCode" placeholder="Código postal">

  <input type="tel" id="phone" placeholder="Teléfono">

  <input type="email" id="email" placeholder="Email">

  <input type="password" id="password" placeholder="Password">

  <input type="password" id="confirmPassword" placeholder="Confirmar password">

  <button onclick="register()">Registrarse</button>

  <p id="msg"></p>

  <script>

    async function register() {

      const name = document.getElementById("name").value;
      const lastname = document.getElementById("lastname").value;
      const nif = document.getElementById("nif").value;
      const address = document.getElementById("address").value;
      const city = document.getElementById("city").value;
      const postalCode = document.getElementById("postalCode").value;
      const phone = document.getElementById("phone").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      const msg = document.getElementById("msg");

      if (password !== confirmPassword) {

        msg.style.color = "red";
        msg.innerText = "Las passwords no coinciden";

        return;
      }

      try {

        const res = await fetch("http://localhost:3000/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name,
            lastname,
            nif,
            address,
            city,
            postalCode,
            phone,
            email,
            password
          })
        });

        const data = await res.json();

        if (res.ok) {

          msg.style.color = "green";
          msg.innerText = "Usuario creado 🚀";

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1000);

        } else {

          msg.style.color = "red";
          msg.innerText = data.message;
        }

      } catch (err) {

        msg.style.color = "red";
        msg.innerText = "Error de conexión";
      }
    }

  </script>

</body>
</html>
